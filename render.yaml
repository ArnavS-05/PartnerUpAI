services:
  - type: web
    name: partner-up-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/data/partnerup.db
      - key: SESSION_SECRET
        generateValue: true
      - key: MUSE_BASE_URL
        value: https://api.meta.ai/v1
      - key: MUSE_MODEL
        value: muse-spark-1.3
      - key: DEMO_ONLY
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
